# Workspace root. This is NOT a package: it ties the capability packages together so each one
# builds, versions and deploys on its own (ADR-0008).
[project]
name = "data-governance-portfolio"
version = "0.0.0"
description = "Data mesh on open source, with governance built in."
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
# One package per capability (platform/README.md, "Where a file goes"). Code another folder
# imports lives in one of these; scripts import them and nothing else.
members = [
    "governance",
    "platform/access",
    "platform/context/catalog",
    "platform/context/semantics",
    "platform/core/contracts",
    "platform/core/ingestion",
    "platform/core/orchestration",
    "platform/quality",
    "ai",
]

[dependency-groups]
# Every member is in the dev group, so a plain `uv run` has them all installed.
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "datacontract-cli>=1.2",
    "dgp-governance",
    "dgp-platform-access",
    "dgp-platform-catalog",
    "dgp-platform-semantics",
    "dgp-platform-contracts",
    "dgp-platform-ingestion",
    "dgp-platform-orchestration",
    "dgp-platform-quality",
    "dgp-ai",
]
# dbt is heavy and can clash with other tools' pins, so keep it in its own group:
#   uv run --group dbt dbt build
dbt = ["dbt-core>=1.9", "dbt-postgres>=1.9", "dbt-loom>=0.7"]
# The DataHub SDK, for the catalog publishers: uv run --group catalog …
catalog = ["dgp-platform-catalog[publish]"]

[tool.uv.sources]
dgp-governance = { workspace = true }
dgp-platform-access = { workspace = true }
dgp-platform-catalog = { workspace = true }
dgp-platform-semantics = { workspace = true }
dgp-platform-contracts = { workspace = true }
dgp-platform-ingestion = { workspace = true }
dgp-platform-orchestration = { workspace = true }
dgp-platform-quality = { workspace = true }
dgp-ai = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
# Third-party code, copied unchanged.
extend-exclude = ["platform/context/semantics/src/dgp_platform_semantics/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["platform", "governance", "ai", "proofs"]
addopts = "-q"
# Script folders whose tests import the script they test (shared code lives in packages).
pythonpath = [
    "governance/policies",
    "platform/context/semantics",
    "platform/core/infra",
    "platform/core/transform",
]
