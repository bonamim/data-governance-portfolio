# Workspace root. This is NOT a package — it only ties the platform capability
# packages together so each builds, versions and deploys independently (ADR-0008).
[project]
name = "data-governance-portfolio"
version = "0.0.0"
description = "Data mesh on open source, with governance built in."
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
# One package per platform capability. Add platform/quality, platform/catalog, etc.
# as later milestones introduce them.
members = ["platform/ingestion", "platform/orchestration", "platform/quality"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "datacontract-cli>=1.2"]
# dbt is heavy and can clash with other tools' pins, so keep it in its own group:
#   uv run --group dbt dbt build
dbt = ["dbt-core>=1.9", "dbt-postgres>=1.9", "dbt-loom>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["platform/semantics/vendor"]  # third-party code, copied unchanged

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["platform", "governance", "ai", "proofs"]
addopts = "-q"
