# ODCS contract for the shared geolocation landing file (reference data).
# Consumed by Customer and Marketplace, so it is governed at the landing boundary
# to keep consumption standardized. Reference data: timeliness + frequency +
# completeness apply, not content-freshness. Checked by the quality gate (P2).
version: 1.2.0
kind: DataContract
apiVersion: v3.2.0
id: reference.geolocation.landing
name: Reference - Geolocation (landing)
status: draft
description:
  purpose: Zip-code to latitude/longitude reference data, landing as partitioned CSV files.
domain: reference
schema:
  - name: geolocation
    description: "Points sampled inside each Brazilian zip-code prefix, as the source delivers them: one row per point, so a prefix appears many times, with its coordinates, city and state."
    physicalType: file
    authoritativeDefinitions:
      - type: ontology
        url: ../../../../governance/ontology/commerce.ontology.yaml#Location
    properties:
      - name: geolocation_zip_code_prefix
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../dictionary/zip_code_prefix.odcs.yaml
        physicalType: string
        required: true
      - name: geolocation_lat
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../dictionary/latitude.odcs.yaml
        # The file samples many points per zip-code prefix, so a row is one point, not the centre.
        description: "The latitude of one point sampled inside the zip-code prefix, in decimal degrees. The location's latitude is the average of its points."
        physicalType: string
        required: true
      - name: geolocation_lng
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../dictionary/longitude.odcs.yaml
        # The file samples many points per zip-code prefix, so a row is one point, not the centre.
        description: "The longitude of one point sampled inside the zip-code prefix, in decimal degrees. The location's longitude is the average of its points."
        physicalType: string
        required: true
      - name: geolocation_city
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../dictionary/city_name.odcs.yaml
        physicalType: string
        required: true
      - name: geolocation_state
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../dictionary/state_code.odcs.yaml
        physicalType: string
        required: true
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 100000
slaProperties:
  - property: timeOfAvailability
    value: "04:00+00:00"
  - property: frequency
    value: 1
    unit: d
customProperties:
  - property: partitionGranularity
    value: daily
  - property: partitionScheme
    value: dt=YYYY-MM-DD
  - property: retentionDays
    value: 365
  # Landing operations (ADR-0024): how the platform files a delivery it did not produce.
  # No date in the partner's file name: the partition is the arrival time.
  - property: partitionSource
    value: arrival
  - property: completionSignal
    value: per_file
team:
  name: reference
