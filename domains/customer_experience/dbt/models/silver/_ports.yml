version: 2
models:
- name: reviews
  config:
    meta:
      datacontract_cli:
        contract_id: customer_experience.reviews
        owner: customer_experience
      governance_tags:
        SNOWFLAKE.TAGS.SENSITIVITY: INTERNAL
    tags:
    - output_port
  columns:
  - name: review_id
    data_type: text
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__review_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field review_id has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: INTERNAL
    description: 'Identifies one satisfaction-survey answer. Not unique on its own:
      the same review id can appear on several orders.'
  - name: order_id
    data_type: text
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__order_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field order_id has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: INTERNAL
    description: Identifies one order on the marketplace, with the same value in every
      domain.
  - name: review_score
    data_type: integer
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__review_score__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field review_score has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
    description: Whole number from 1 (worst) to 5 (best), the customer's survey answer.
  - name: has_comment
    data_type: boolean
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__has_comment__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field has_comment has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
    description: True when the customer left a free-text comment. The comment itself
      is not published (it can carry PII).
  - name: review_creation_date
    data_type: timestamp
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__review_creation_date__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field review_creation_date has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
    description: Date the satisfaction survey was sent to the customer.
  - name: review_answer_timestamp
    data_type: timestamp
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
    description: When the customer answered the satisfaction survey, empty if not
      answered yet.
  description: 'One row per customer satisfaction review of an order: the score, when
    it was sent and answered, and whether it has a comment.'
