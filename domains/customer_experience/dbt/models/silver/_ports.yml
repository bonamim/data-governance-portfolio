      datacontract_cli:
        contract_id: customer_experience.reviews
        owner: customer_experience
    tags:
    - output_port
  columns:
  - name: review_id
    data_type: text
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__review_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field review_id has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
