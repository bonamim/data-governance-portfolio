version: 2
models:
- name: reviews
  config:
    meta:
      datacontract_cli:
        contract_id: customer_experience.reviews
        owner: customer_experience
    tags:
    - output_port
  columns:
  - name: review_id
    data_type: text
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__review_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field review_id has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
    description: Review identifier.
  - name: order_id
    data_type: text
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__order_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field order_id has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
    description: The reviewed order; joins to sales.orders.
  - name: review_score
    data_type: integer
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__review_score__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field review_score has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
    description: Customer satisfaction score from 1 (worst) to 5 (best).
  - name: has_comment
    data_type: boolean
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__has_comment__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field has_comment has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
    description: True when the customer left a free-text comment. The comment itself is not published (it can carry PII).
  - name: review_creation_date
    data_type: timestamp
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: reviews__review_creation_date__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field review_creation_date has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
    description: Date the satisfaction survey was sent to the customer.
  - name: review_answer_timestamp
    data_type: timestamp
    config:
      meta:
        datacontract_cli:
          generated: true
    description: When the customer answered the survey; null if not yet answered.
  description: 'One row per customer satisfaction review of an order: the score, when it was sent and answered, and whether it has a comment.'
