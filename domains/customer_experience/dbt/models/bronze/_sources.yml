version: 2
sources:
- name: customer_experience_raw
  description: Review events as loaded from the landing zone (text columns, internal).
  schema: customer_experience_raw
  tables:
  - name: reviews
    description: 'One row per survey answer and order, as the source delivers it:
      the score, when it was sent and answered, and the customer''s free-text comment.'
    columns:
    - name: review_id
      description: 'Identifies one satisfaction-survey answer. Not unique on its own:
        the same review id can appear on several orders.'
    - name: order_id
      description: Identifies one order on the marketplace, with the same value in
        every domain.
    - name: review_score
      description: Whole number from 1 (worst) to 5 (best), the customer's survey
        answer.
    - name: review_comment_title
      description: 'Short headline the customer typed above their survey comment,
        empty when they wrote none. Free text the customer controls, so it can name
        or contact a person: personal data, never published.'
    - name: review_comment_message
      description: 'The comment the customer wrote with their survey answer, empty
        when they wrote none. Free text the customer controls, so it can name or contact
        a person: personal data, never published (the reviews port carries only whether
        one exists, has_comment).'
    - name: review_creation_date
      description: Date the satisfaction survey was sent to the customer.
    - name: review_answer_timestamp
      description: When the customer answered the satisfaction survey, empty if not
        answered yet.
    - name: _system_batch_id
      description: 'The delivery batch the row was loaded from: one file, a whole
        partition under a batch completion signal, or one snapshot of a source table.
        Joins the row to its ingestion ledger entries (platform_meta.ingestion_ledger.batch_id).'
    - name: _system_source_path
      description: 'Where the row came from, as a URI whatever the source: the archived
        file it was read from (s3://...), the database table it was copied from (postgres://...),
        or a stream''s topic or an API''s endpoint.'
    - name: _system_partition
      description: The partition the row was delivered for, in the dataset's partition
        scheme (dt=YYYY-MM-DD). For a full snapshot of a source table, the day the
        snapshot was taken.
    - name: _system_loaded_at
      description: When the load that wrote the row ran, in UTC. Every row of one
        load shares it.
