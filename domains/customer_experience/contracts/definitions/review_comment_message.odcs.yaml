description: >-
  The comment the customer wrote with their survey answer, empty when they wrote none. Free text
  the customer controls, so it can name or contact a person: personal data, never published (the
  reviews port carries only whether one exists, has_comment).
logicalType: string
classification: restricted
customProperties:
  - property: privacyCategory  # free text can hold a name, a phone or an email
    value: identifier
  - property: maskingPolicy  # ADR-0013: free text can't be partly masked, so it is hidden whole
    value:
      method: full
      unmask_roles: [compliance]
authoritativeDefinitions:
  - type: ontology  # the ontology value type this data element holds
    url: ../../../../governance/ontology/commerce.ontology.yaml#ReviewCommentMessage
