# ODCS contract for the customer_experience.reviews OUTPUT PORT (a published table).
# Free-text comments are not exposed; only the score, timing and a has_comment flag.
version: 1.0.0
kind: DataContract
apiVersion: v3.2.0
id: customer_experience.reviews
name: Customer Experience - Reviews (output port)
status: active
description:
  purpose: Published review scores and timing per order, without free-text comments.
domain: customer_experience
schema:
  - name: reviews
    physicalType: table
    properties:
      - name: review_id
        logicalType: string
        physicalType: text
        required: true
        classification: internal
      - name: order_id
        logicalType: string
        physicalType: text
        required: true
        classification: internal
      - name: review_score
        logicalType: integer
        physicalType: integer
        required: true
        classification: public
        logicalTypeOptions:
          minimum: 1
          maximum: 5
      - name: has_comment
        logicalType: boolean
        physicalType: boolean
        required: true
        classification: public
      - name: review_creation_date
        logicalType: date
        physicalType: timestamp
        required: true
        classification: public
      - name: review_answer_timestamp
        logicalType: date
        physicalType: timestamp
        required: false
        classification: public
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 1000
team:
  name: customer_experience
