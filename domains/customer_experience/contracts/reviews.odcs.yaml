# ODCS contract for the customer_experience.reviews OUTPUT PORT (a published table).
# Free-text comments are not exposed, only the score, timing and a has_comment flag.
version: 1.0.0
kind: DataContract
apiVersion: v3.2.0
id: customer_experience.reviews
name: Customer Experience - Reviews (output port)
status: active
description:
  purpose: Published review scores and timing per order, without free-text comments.
domain: customer_experience
schema:
  - name: reviews
    description: "One row per customer satisfaction review of an order: the score, when it was sent and answered, and whether it has a comment."
    physicalType: table
    tags: [output_port]
    authoritativeDefinitions:
      - type: ontology
        url: ../../../governance/ontology/commerce.ontology.yaml#Review
    properties:
      - name: review_id
        authoritativeDefinitions:
          - type: businessDefinition
            url: definitions/review_id.odcs.yaml
        physicalType: text
        required: true
      - name: order_id
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../../sales/contracts/definitions/order_id.odcs.yaml
        physicalType: text
        required: true
      - name: review_score
        authoritativeDefinitions:
          - type: businessDefinition
            url: definitions/review_score.odcs.yaml
        physicalType: integer
        required: true
      - name: has_comment
        description: "True when the customer left a free-text comment. The comment itself is not published (it can carry PII)."
        logicalType: boolean
        physicalType: boolean
        required: true
        classification: public
      - name: review_creation_date
        authoritativeDefinitions:
          - type: businessDefinition
            url: definitions/review_sent_date.odcs.yaml
        physicalType: timestamp
        required: true
      - name: review_answer_timestamp
        authoritativeDefinitions:
          - type: businessDefinition
            url: definitions/review_answered_at.odcs.yaml
        physicalType: timestamp
        required: false
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 1000
team:
  name: customer_experience
