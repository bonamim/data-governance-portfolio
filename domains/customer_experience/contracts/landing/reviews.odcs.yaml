# ODCS contract for the Customer Experience reviews landing file.
# The single source of truth for this landing dataset: schema, quality, SLAs
# (timeliness, freshness, completeness) and operational properties (partitioning,
# retention). Checked by the landing-zone quality gate before load (proof P2);
# the time-based SLAs are monitored at M4 (DataHub) where there is somewhere to alert.
version: 1.2.0
kind: DataContract
apiVersion: v3.2.0
id: customer_experience.reviews.landing
name: Customer Experience - Reviews (landing)
status: draft
description:
  purpose: Customer review events, landing daily from the source system as partitioned CSV files.
domain: customer_experience
schema:
  - name: reviews
    physicalType: file
    properties:
      - name: review_id
        logicalType: string
        physicalType: string
        required: true
        # Not unique: in the Olist source a review_id can map to several orders
        # (a real characteristic of the dataset, confirmed by the quality gate).
        classification: internal
      - name: order_id
        logicalType: string
        physicalType: string
        required: true
        classification: internal
      - name: review_score
        logicalType: integer
        physicalType: integer
        required: true
        classification: public
        logicalTypeOptions:
          minimum: 1
          maximum: 5
      - name: review_comment_title
        logicalType: string
        physicalType: string
        required: false
        classification: internal
      - name: review_comment_message
        logicalType: string
        physicalType: string
        required: false
        classification: internal
      - name: review_creation_date
        logicalType: date
        physicalType: string
        required: true
        classification: public
      - name: review_answer_timestamp
        logicalType: date
        physicalType: string
        required: false
        classification: public
    quality:
      # File completeness: a daily partition must carry at least this many rows.
      # Executed by the quality gate on arrival.
      - type: library
        metric: rowCount
        mustBeGreaterThan: 1000
# SLAs. The element is the event-time column freshness is measured against.
slaDefaultElement: reviews.review_creation_date
slaProperties:
  # Delivery timeliness: the partition must be available by 04:00 UTC.
  - property: timeOfAvailability
    value: "04:00+00:00"
    element: reviews.review_creation_date
  # Frequency: a new partition every day.
  - property: frequency
    value: 1
    unit: d
  # Data freshness: data must include events up to the end of the previous day.
  - property: latency
    value: 1
    unit: d
    element: reviews.review_creation_date
customProperties:
  - property: partitionGranularity
    value: daily
  - property: partitionScheme
    value: dt=YYYY-MM-DD
  - property: retentionDays
    value: 365
  # Landing operations (ADR-0024): how the platform files a delivery it did not produce.
  # The partner names each daily file with its business date; we read the partition from it.
  - property: partitionSource
    value: filename
  - property: filenamePattern
    value: '^olist_order_reviews_(?P<date>\d{8})\.csv$'
  - property: completionSignal
    value: per_file
team:
  name: customer_experience
