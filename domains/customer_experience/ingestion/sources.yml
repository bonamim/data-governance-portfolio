# Customer Experience domain — source registration (owned by the CX team).
# Reviews arrive as files in the landing zone — the source type that exercises
# the landing-zone quality gate (proof P2) and the idempotent-by-ETag load (P6).
domain: customer_experience
datasets:
  - name: reviews
    source: {type: landing, olist_file: olist_order_reviews_dataset.csv,
             delivered_as: 'olist_order_reviews_{date:%Y%m%d}.csv'}
    target: {raw_table: reviews}
