# ODCS contract for the sales.sales_performance OUTPUT PORT (consumer-aligned).
# Source of truth for the schema and contractual quality; the dbt model YAML and
# tests are generated from this file by `datacontract dbt sync`.
version: 1.1.0
kind: DataContract
apiVersion: v3.2.0
id: sales.sales_performance
name: Sales - Sales Performance (output port)
status: active
description:
  purpose: Order and revenue performance by customer location, with average review score.
domain: sales
schema:
  - name: sales_performance
    description: "One row per customer state: distinct orders, customer keys and people, total revenue and average review score."
    physicalType: table
    tags: [output_port]
    properties:
      - name: customer_state
        description: "Two-letter Brazilian state (grain)."
        logicalType: string
        physicalType: text
        required: true
        unique: true
        classification: public
      - name: num_orders
        description: "Distinct orders placed by customers in the state."
        logicalType: integer
        physicalType: integer
        required: true
        classification: public
      - name: num_customers
        description: "Distinct customer keys (customer_id) in the state. customer_id is issued per order, so this counts order-level buyers, not distinct people."
        logicalType: integer
        physicalType: integer
        required: true
        classification: public
      - name: num_people
        description: "Distinct people (customer_unique_id, read pseudonymised) with an order delivered in the state. A person with orders in several states counts in each, so states don't add up to the platform total."
        logicalType: integer
        physicalType: integer
        required: true
        classification: public
      - name: total_revenue
        description: "Total payment value of the state's orders."
        logicalType: number
        physicalType: numeric
        required: true
        classification: public
      - name: avg_review_score
        description: "Average review score (1-5) across the state's reviewed orders."
        logicalType: number
        physicalType: numeric
        required: false
        classification: public
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 10
team:
  name: sales
