# ODCS contract for the sales.seller_performance OUTPUT PORT (consumer-aligned).
# Source of truth for the schema and contractual quality. The dbt model YAML and
# tests are generated from this file by `datacontract dbt sync`.
version: 1.0.0
kind: DataContract
apiVersion: v3.2.0
id: sales.seller_performance
name: Sales - Seller Performance (output port)
status: active
description:
  purpose: Sales performance per seller, covering orders, items and the value of the items sold.
domain: sales
schema:
  - name: seller_performance
    description: "One row per seller: distinct orders and items sold, the value of those items at their price, and the freight charged on them."
    physicalType: table
    tags: [output_port]
    authoritativeDefinitions:
      - type: ontology
        url: ../../../governance/ontology/commerce.ontology.yaml#Seller
    properties:
      - name: seller_id
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../../marketplace/contracts/definitions/seller_id.odcs.yaml
        physicalType: text
        required: true
        unique: true
      - name: orders_sold
        description: "Distinct orders containing at least one of the seller's items."
        logicalType: integer
        physicalType: integer
        required: true
        classification: public
      - name: items_sold
        description: "Order lines (items) the seller sold."
        logicalType: integer
        physicalType: integer
        required: true
        classification: public
      - name: total_revenue
        # Homonym of sales_performance.total_revenue (payments incl. freight): here it is the
        # items' value, excluding freight. Each links its own value type (ADR-0027).
        authoritativeDefinitions:
          - type: businessDefinition
            url: definitions/items_value.odcs.yaml
        description: "Value of the seller's items sold, at their price, excluding freight."
        physicalType: numeric
        required: true
      - name: total_freight
        description: "Freight charged on the seller's items."
        logicalType: number
        physicalType: numeric
        required: true
        classification: public
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 100
team:
  name: sales
