version: 1.0.0
kind: DataContract
apiVersion: v3.2.0
id: sales.orders
name: Sales - Orders (output port)
status: active
description:
  purpose: Authoritative record of customer orders and their lifecycle status.
domain: sales
schema:
- name: orders
  description: One row per customer order, with its status and lifecycle timestamps (purchase, approval, delivery, estimated delivery).
  physicalType: table
  authoritativeDefinitions:
  - type: ontology
    url: ../../../governance/ontology/commerce.ontology.yaml#Order
  properties:
  - name: order_id
    authoritativeDefinitions:
    - type: businessDefinition
      url: definitions/order_id.odcs.yaml
    physicalType: text
    required: true
    unique: true
  - name: customer_id
    authoritativeDefinitions:
    - type: businessDefinition
      url: definitions/customer_key.odcs.yaml
    physicalType: text
    required: true
  - name: order_status
    description: Lifecycle status of the order.
    logicalType: string
    physicalType: text
    required: true
    classification: public
  - name: order_purchase_timestamp
    description: When the order was placed.
    logicalType: date
    physicalType: timestamp
    required: true
    classification: public
  - name: order_approved_at
    description: When the order was approved.
    logicalType: date
    physicalType: timestamp
    required: false
    classification: public
  - name: order_delivered_customer_date
    description: When the order was delivered to the customer.
    logicalType: date
    physicalType: timestamp
    required: false
    classification: public
  - name: order_estimated_delivery_date
    description: Estimated delivery date given to the customer.
    logicalType: date
    physicalType: timestamp
    required: false
    classification: public
  quality:
  - type: library
    metric: rowCount
    mustBeGreaterThan: 1000
  tags:
  - output_port
slaProperties:
- property: frequency
  value: 1
  unit: d
- property: latency
  value: 1
  unit: d
  element: orders.order_purchase_timestamp
team:
  name: sales
