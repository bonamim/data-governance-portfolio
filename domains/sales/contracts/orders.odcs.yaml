version: 1.0.1
kind: DataContract
apiVersion: v3.2.0
id: sales.orders
name: Sales - Orders (output port)
status: active
description:
  purpose: Authoritative record of customer orders and their lifecycle status.
domain: sales
schema:
- name: orders
  description: One row per customer order, with its status and lifecycle timestamps (purchase, approval, delivery, estimated delivery).
  physicalType: table
  authoritativeDefinitions:
  - type: ontology
    url: ../../../governance/ontology/commerce.ontology.yaml#Order
  properties:
  - name: order_id
    authoritativeDefinitions:
    - type: businessDefinition
      url: dictionary/order_id.odcs.yaml
    physicalType: text
    required: true
    unique: true
  - name: customer_id
    authoritativeDefinitions:
    - type: businessDefinition
      url: dictionary/customer_key.odcs.yaml
    physicalType: text
    required: true
  - name: order_status
    authoritativeDefinitions:
    - type: businessDefinition
      url: dictionary/order_status.odcs.yaml
    physicalType: text
    required: true
  - name: order_purchase_timestamp
    authoritativeDefinitions:
    - type: businessDefinition
      url: dictionary/order_purchased_at.odcs.yaml
    physicalType: timestamp
    required: true
  - name: order_approved_at
    authoritativeDefinitions:
    - type: businessDefinition
      url: dictionary/order_approved_at.odcs.yaml
    physicalType: timestamp
    required: false
  - name: order_delivered_customer_date
    authoritativeDefinitions:
    - type: businessDefinition
      url: dictionary/order_delivered_at.odcs.yaml
    physicalType: timestamp
    required: false
  - name: order_estimated_delivery_date
    authoritativeDefinitions:
    - type: businessDefinition
      url: dictionary/order_estimated_delivery_at.odcs.yaml
    physicalType: timestamp
    required: false
  quality:
  - type: library
    metric: rowCount
    mustBeGreaterThan: 1000
  tags:
  - output_port
slaProperties:
- property: frequency
  value: 1
  unit: d
- property: latency
  value: 1
  unit: d
  element: orders.order_purchase_timestamp
team:
  name: sales
