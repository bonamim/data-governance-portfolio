# Apache Ossie semantic model for the sales.sales_performance output port (ADR-0010).
# Owned by the Sales domain. ODCS governs the port's interface + quality; this governs its MEANING
# — the dimensions and metrics — so Superset (M6) and the AI agent (M7) compute the same numbers.
# Validated in CI (governance/policies/check_semantics.py): every field/metric must resolve to a
# column in the port's ODCS contract, so the semantics can't drift from the contract.
version: "0.2.0.dev0"
name: sales_performance
datasets:
  - name: sales_performance
    source: analytics.sales_gold.sales_performance
    description: "Regional sales scorecard — order and revenue performance by customer state."
    primary_key: [customer_state]
    fields:
      - name: customer_state
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: customer_state
      - name: num_orders
        expression:
          dialects: [{dialect: ANSI_SQL, expression: num_orders}]
      - name: num_customers
        expression:
          dialects: [{dialect: ANSI_SQL, expression: num_customers}]
      - name: num_people
        expression:
          dialects: [{dialect: ANSI_SQL, expression: num_people}]
      - name: total_revenue
        expression:
          dialects: [{dialect: ANSI_SQL, expression: total_revenue}]
      - name: avg_review_score
        expression:
          dialects: [{dialect: ANSI_SQL, expression: avg_review_score}]
metrics:
  - name: total_revenue
    description: "Total payment value across the selected states."
    datatype: Decimal
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: "SUM(sales_performance.total_revenue)"
  - name: order_count
    description: "Total distinct orders across the selected states."
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: "SUM(sales_performance.num_orders)"
  - name: customer_count
    description: "Total distinct customer keys (customer_id) across the selected states. customer_id is issued per order, so this counts order-level buyers, not distinct people."
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: "SUM(sales_performance.num_customers)"
  - name: people_count
    description: "Distinct people (customers as persons, not per-order keys) across the selected states. Exact for a single state; summed over several states it counts a person once per state they ordered in, so it slightly overstates a multi-state total."
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: "SUM(sales_performance.num_people)"
  - name: avg_review_score
    description: "Average review score (1-5), mean of the state scores."
    datatype: Decimal
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: "AVG(sales_performance.avg_review_score)"
