version: 2

models:
  - name: orders
    description: "Output port: published Sales orders. Governed by its ODCS contract."
    columns:
      - name: order_id
        description: "Order identifier (primary key)."
        data_type: text
        data_tests:
          - not_null:
              description: Check that field order_id has no missing values
              config:
                meta:
                  datacontract_cli:
                    include_in_tests: true
                    check: orders__order_id__field_required
                    contract_versions:
                      - 1.0.0
                    generated: false
          - unique:
              description: Check that field order_id has no duplicate values
              config:
                meta:
                  datacontract_cli:
                    include_in_tests: true
                    check: orders__order_id__field_unique
                    contract_versions:
                      - 1.0.0
                    generated: false
      - name: customer_id
        description: "Customer who placed the order."
        data_type: text
        data_tests:
          - not_null:
              description: Check that field customer_id has no missing values
              config:
                meta:
                  datacontract_cli:
                    include_in_tests: true
                    check: orders__customer_id__field_required
                    contract_versions:
                      - 1.0.0
                    generated: false
      - name: order_status
        description: "Lifecycle status of the order."
        data_type: text
        data_tests:
          - not_null:
              description: Check that field order_status has no missing values
              config:
                meta:
                  datacontract_cli:
                    include_in_tests: true
                    check: orders__order_status__field_required
                    contract_versions:
                      - 1.0.0
                    generated: false
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - invoiced
                - processing
                - created
                - approved
      - name: order_purchase_timestamp
        description: "When the order was placed."
        data_type: timestamp
        data_tests:
          - not_null:
              description: Check that field order_purchase_timestamp has no missing values
              config:
                meta:
                  datacontract_cli:
                    include_in_tests: true
                    check: orders__order_purchase_timestamp__field_required
                    contract_versions:
                      - 1.0.0
                    generated: false
      - name: order_approved_at
        data_type: timestamp
        config:
          meta:
            datacontract_cli:
              generated: true
      - name: order_delivered_customer_date
        data_type: timestamp
        config:
          meta:
            datacontract_cli:
              generated: true
      - name: order_estimated_delivery_date
        data_type: timestamp
        config:
          meta:
            datacontract_cli:
              generated: true
    config:
      meta:
        datacontract_cli:
          contract_id: sales.orders
          owner: sales
  - name: sales_performance
    description: "Output port (aggregate): order and revenue performance by customer state."
    columns:
      - name: customer_state
        description: "Two-letter Brazilian state (grain)."
        data_type: text
        data_tests:
          - not_null:
              description: Check that field customer_state has no missing values
              config:
                meta:
                  datacontract_cli:
                    include_in_tests: true
                    check: sales_performance__customer_state__field_required
                    contract_versions:
                      - 1.0.0
                    generated: false
          - unique:
              description: Check that field customer_state has no duplicate values
              config:
                meta:
                  datacontract_cli:
                    include_in_tests: true
                    check: sales_performance__customer_state__field_unique
                    contract_versions:
                      - 1.0.0
                    generated: false
      - name: num_orders
        data_type: integer
        description: Distinct orders placed by customers in the state.
        data_tests:
          - not_null:
              description: Check that field num_orders has no missing values
              config:
                meta:
                  datacontract_cli:
                    include_in_tests: true
                    check: sales_performance__num_orders__field_required
                    contract_versions:
                      - 1.0.0
                    generated: false
      - name: total_revenue
        data_type: numeric
        description: Total payment value of the state's orders.
        data_tests:
          - not_null:
              description: Check that field total_revenue has no missing values
              config:
                meta:
                  datacontract_cli:
                    include_in_tests: true
                    check: sales_performance__total_revenue__field_required
                    contract_versions:
                      - 1.0.0
                    generated: false
      - name: num_customers
        data_type: integer
        description: Distinct customers in the state.
        data_tests:
          - not_null:
              config:
                meta:
                  datacontract_cli:
                    check: sales_performance__num_customers__field_required
                    include_in_tests: true
                    contract_versions:
                      - 1.0.0
                    generated: true
              description: Check that field num_customers has no missing values
        config:
          meta:
            datacontract_cli:
              generated: true
      - name: avg_review_score
        data_type: numeric
        description: Average review score (1-5) across the state's reviewed orders.
        config:
          meta:
            datacontract_cli:
              generated: true
    config:
      meta:
        datacontract_cli:
          contract_id: sales.sales_performance
          owner: sales
