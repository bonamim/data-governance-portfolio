version: 2
models:
- name: orders
  config:
    meta:
      datacontract_cli:
        contract_id: sales.orders
        owner: sales
      governance_tags:
        SNOWFLAKE.TAGS.SENSITIVITY: INTERNAL
    tags:
    - output_port
  columns:
  - name: order_id
    data_type: text
    description: Identifies one order on the marketplace, with the same value in every
      domain.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: orders__order_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.1
              generated: true
        description: Check that field order_id has no missing values
    - unique:
        config:
          meta:
            datacontract_cli:
              check: orders__order_id__field_unique
              include_in_tests: true
              contract_versions:
              - 1.0.1
              generated: true
        description: Check that field order_id has no duplicate values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: INTERNAL
  - name: customer_id
    data_type: text
    description: '32-character hexadecimal key, issued once per order: it joins sales.orders
      to customer.customers one to one, and is not a person identifier (count people
      with customer_unique_id).'
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: orders__customer_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.1
              generated: true
        description: Check that field customer_id has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: INTERNAL
  - name: order_status
    data_type: text
    description: 'The order''s lifecycle status, as the source records it: created,
      approved, invoiced, processing, shipped, delivered, canceled or unavailable.'
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: orders__order_status__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.1
              generated: true
        description: Check that field order_status has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
  - name: order_purchase_timestamp
    data_type: timestamp
    description: When the customer placed the order.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: orders__order_purchase_timestamp__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.1
              generated: true
        description: Check that field order_purchase_timestamp has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
  - name: order_approved_at
    data_type: timestamp
    description: When the order was approved, empty while it is not.
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
  - name: order_delivered_customer_date
    data_type: timestamp
    description: When the order was delivered to the customer, empty until it is.
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
  - name: order_estimated_delivery_date
    data_type: timestamp
    description: The delivery date the customer was given when the order was placed.
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
  description: One row per customer order, with its status and lifecycle timestamps
    (purchase, approval, delivery, estimated delivery).
