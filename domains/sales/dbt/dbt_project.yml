name: dgp_sales
version: "1.0.0"
config-version: 2
profile: dgp_sales

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion internal layers. There is NO output-port folder or schema: an output
# port is any model tagged `output_port` in its own SQL (ADR-0012), so it can live
# in bronze, silver or gold. Publishing is a deliberate per-model tag, not a location.
models:
  dgp_sales:
    # Write model/column descriptions into the warehouse as COMMENTs, so the table/view asset
    # itself is documented (not just the dbt node) for DataHub and any other reader.
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +schema: bronze
      +materialized: view
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
