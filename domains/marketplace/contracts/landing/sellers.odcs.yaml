# ODCS contract for the Marketplace sellers landing file.
# Seller registry (reference-style): no event timestamp, so timeliness + frequency +
# completeness apply, but not content-freshness. Checked by the quality gate (P2).
version: 1.2.0
kind: DataContract
apiVersion: v3.2.0
id: marketplace.sellers.landing
name: Marketplace - Sellers (landing)
status: draft
description:
  purpose: Seller registry, landing daily from the source system as partitioned CSV files.
domain: marketplace
schema:
  - name: sellers
    description: "One row per seller on the marketplace, as the source delivers it: the seller id and where the seller is based."
    physicalType: file
    authoritativeDefinitions:
      - type: ontology
        url: ../../../../governance/ontology/commerce.ontology.yaml#Seller
    properties:
      - name: seller_id
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../definitions/seller_id.odcs.yaml
        physicalType: string
        required: true
        unique: true
      - name: seller_zip_code_prefix
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../../../reference/contracts/definitions/zip_code_prefix.odcs.yaml
        physicalType: string
        required: true
      - name: seller_city
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../../../reference/contracts/definitions/city_name.odcs.yaml
        physicalType: string
        required: true
      - name: seller_state
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../../../reference/contracts/definitions/state_code.odcs.yaml
        physicalType: string
        required: true
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 100
slaProperties:
  - property: timeOfAvailability
    value: "04:00+00:00"
  - property: frequency
    value: 1
    unit: d
customProperties:
  - property: partitionGranularity
    value: daily
  - property: partitionScheme
    value: dt=YYYY-MM-DD
  - property: retentionDays
    value: 365
  # Landing operations (ADR-0024): how the platform files a delivery it did not produce.
  - property: partitionSource
    value: filename
  - property: filenamePattern
    value: '^sellers_(?P<date>\d{4}-\d{2}-\d{2})\.csv$'
  - property: completionSignal
    value: per_file
team:
  name: marketplace
