name: dgp_customer
version: "1.0.0"
config-version: 2
profile: dgp_customer

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion internal layers; output ports are tagged per-model (ADR-0012).
models:
  dgp_customer:
    # Write model/column descriptions into the warehouse as COMMENTs, so the table/view asset
    # itself is documented (not just the dbt node) for DataHub and any other reader.
    +persist_docs:
      relation: true
      columns: true
    # Governed tags (sensitivity, privacy category) on output ports, set as part of the build so
    # data is never in an untagged table (ADR-0027); a no-op on warehouses without object tags.
    +post-hook: ["{{ dgp_dbt.apply_governance_tags() }}"]
    bronze:
      +schema: bronze
      +materialized: view
    silver:
      +schema: silver
      +materialized: view
