version: 2
models:
- name: customers
  config:
    meta:
      datacontract_cli:
        contract_id: customer.customers
        owner: customer
      governance_tags:
        SNOWFLAKE.TAGS.SENSITIVITY: RESTRICTED
    tags:
    - output_port
  columns:
  - name: customer_id
    data_type: text
    description: '32-character hexadecimal key, issued once per order: it joins sales.orders
      to customer.customers one to one, and is not a person identifier (count people
      with customer_unique_id).'
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: customers__customer_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field customer_id has no missing values
    - unique:
        config:
          meta:
            datacontract_cli:
              check: customers__customer_id__field_unique
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field customer_id has no duplicate values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.TAGS.SENSITIVITY: INTERNAL
  - name: customer_zip_code_prefix
    data_type: text
    description: The customer's zip-code prefix. With city and state it narrows a
      person down, so it is internal here, not public.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: customers__customer_zip_code_prefix__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field customer_zip_code_prefix has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.CORE.PRIVACY_CATEGORY: QUASI_IDENTIFIER
          SNOWFLAKE.TAGS.SENSITIVITY: INTERNAL
  - name: customer_city
    data_type: text
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: customers__customer_city__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field customer_city has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.CORE.PRIVACY_CATEGORY: QUASI_IDENTIFIER
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
    description: City of the customer's delivery address (lower case, as entered).
  - name: customer_state
    data_type: text
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: customers__customer_state__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field customer_state has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.CORE.PRIVACY_CATEGORY: QUASI_IDENTIFIER
          SNOWFLAKE.TAGS.SENSITIVITY: PUBLIC
    description: Two-letter Brazilian state of the customer's delivery address (e.g.
      SP, RJ).
  - name: customer_unique_id
    data_type: text
    description: "The person identifier (links a person's orders). PII \u2014 masked\
      \ at read by role: consumers see a hash pseudonym, the compliance role sees\
      \ the raw value."
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: customers__customer_unique_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field customer_unique_id has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
        governance_tags:
          SNOWFLAKE.CORE.PRIVACY_CATEGORY: IDENTIFIER
          SNOWFLAKE.TAGS.SENSITIVITY: RESTRICTED
  description: One row per order-level customer key, with the customer's location
    and a person identifier masked by role.
