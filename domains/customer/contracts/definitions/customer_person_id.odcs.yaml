businessName: Customer person id
description: >-
  Identifies a person across all their orders. Personal data: count people with it, read it
  pseudonymised.
logicalType: string
classification: restricted
synonyms:
  - synonym: customer_unique_id
customProperties:
  - property: privacyCategory
    value: identifier
  - property: maskingPolicy  # ADR-0013: every column holding a person id is masked the same way
    value:
      method: hash              # hash | partial | full | null
      unmask_roles: [compliance]  # roles that see the raw value; all others see the mask
authoritativeDefinitions:
  - type: ontology  # the ontology value type this data element holds
    url: ../../../../governance/ontology/commerce.ontology.yaml#CustomerPersonId
