# ODCS contract for the customer.customers OUTPUT PORT (a published table).
# Demonstrates PII governance as a ROLE-BASED POLICY (ADR-0013): the person identifier is stored
# and masked AT READ by role — consumers see a pseudonym, an unmask role sees the raw value.
# The policy is declared on the column here (source of truth) and enforced per platform.
version: 1.0.0
kind: DataContract
apiVersion: v3.2.0
id: customer.customers
name: Customer - Customers (output port)
status: active
description:
  purpose: Customer master with location and a pseudonymised person identity.
domain: customer
schema:
  - name: customers
    description: "One row per order-level customer key, with the customer's location and a person identifier masked by role."
    physicalType: table
    tags: [output_port]
    authoritativeDefinitions:
      - type: ontology
        url: ../../../governance/ontology/commerce.ontology.yaml#Customer
    properties:
      - name: customer_id
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../../sales/contracts/definitions/customer_key.odcs.yaml
        physicalType: text
        required: true
        unique: true
      - name: customer_unique_id
        authoritativeDefinitions:
          - type: businessDefinition
            url: definitions/customer_person_id.odcs.yaml
        description: "The person identifier (links a person's orders). PII — masked at read by role: consumers see a hash pseudonym, the compliance role sees the raw value."
        physicalType: text
        required: true
      - name: customer_zip_code_prefix
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../../reference/contracts/definitions/zip_code_prefix.odcs.yaml
        description: "The customer's zip-code prefix. With city and state it narrows a person down, so it is internal here, not public."
        physicalType: text
        required: true
        classification: internal
        customProperties:
          - property: privacyCategory
            value: quasi_identifier
      - name: customer_city
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../../reference/contracts/definitions/city_name.odcs.yaml
        description: "City of the customer's delivery address (lower case, as entered)."
        physicalType: text
        required: true
        customProperties:
          - property: privacyCategory
            value: quasi_identifier
      - name: customer_state
        authoritativeDefinitions:
          - type: businessDefinition
            url: ../../reference/contracts/definitions/state_code.odcs.yaml
        description: "Two-letter Brazilian state of the customer's delivery address (e.g. SP, RJ)."
        physicalType: text
        required: true
        customProperties:
          - property: privacyCategory
            value: quasi_identifier
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 1000
customProperties:
  - property: piiEnforcement
    value: "Role-based masking view (dgp_platform_access.apply_masking); md5 is the local demo mask, production uses a keyed HMAC via a secrets manager and a native masking policy (ADR-0013)."
team:
  name: customer
