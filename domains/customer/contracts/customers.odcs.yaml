# ODCS contract for the customer.customers OUTPUT PORT (a published table).
# Demonstrates PII governance as a ROLE-BASED POLICY (ADR-0013): the person identifier is stored
# and masked AT READ by role — consumers see a pseudonym, an unmask role sees the raw value.
# The policy is declared on the column here (source of truth) and enforced per platform.
version: 1.0.0
kind: DataContract
apiVersion: v3.2.0
id: customer.customers
name: Customer - Customers (output port)
status: active
description:
  purpose: Customer master with location and a pseudonymised person identity.
domain: customer
schema:
  - name: customers
    physicalType: table
    tags: [output_port]
    properties:
      - name: customer_id
        description: "Per-order customer key; joins to sales.orders."
        logicalType: string
        physicalType: text
        required: true
        unique: true
        classification: internal
      - name: customer_unique_id
        description: "The person identifier (links a person's orders). PII — masked at read by role: consumers see a hash pseudonym, the compliance role sees the raw value."
        logicalType: string
        physicalType: text
        required: true
        classification: pii
        customProperties:
          - property: maskingPolicy
            value:
              method: hash              # hash | partial | full | null
              unmask_roles: [compliance]  # roles that see the raw value; all others see the mask
      - name: customer_zip_code_prefix
        description: "Location quasi-identifier."
        logicalType: string
        physicalType: text
        required: true
        classification: internal
      - name: customer_city
        logicalType: string
        physicalType: text
        required: true
        classification: public
      - name: customer_state
        logicalType: string
        physicalType: text
        required: true
        classification: public
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 1000
customProperties:
  - property: piiEnforcement
    value: "Role-based masking view (platform/access/apply_masking.py); md5 is the local demo mask, production uses a keyed HMAC via a secrets manager and a native masking policy (ADR-0013)."
team:
  name: customer
