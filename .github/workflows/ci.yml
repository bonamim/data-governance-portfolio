name: CI

# Federated computational governance, enforced on every change (ADR-0003, ADR-0008):
# module boundaries, lint, and tests must pass before merge. The breaking-change
# contract gate (proof P5) is added in milestone M5.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance-checks:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to major tags here; pin to a commit SHA
      # before go-live (docs/production-readiness.md, CI/CD section).
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --group dbt
      - name: Domain registry matches folders
        run: uv run python governance/policies/check_domains.py
      - name: Module boundaries (ADR-0008)
        run: uv run python governance/policies/check_boundaries.py
      - name: Contract governance (every landing dataset has a valid ODCS contract)
        run: uv run python governance/policies/check_contracts.py
      - name: Data product governance (definitions meet the standard)
        run: uv run python governance/policies/check_data_products.py
      - name: Publishing guardrail (output-port contract <-> model <-> definition)
        run: uv run python governance/policies/check_output_ports.py
      - name: ODCS is source of truth (dbt schema not drifted from contracts)
        run: |
          make sync-contracts
          git diff --exit-code -- domains \
            || { echo "dbt model YAML drifted from the ODCS contracts — run 'make sync-contracts' and commit."; exit 1; }
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
