name: CI

# Federated computational governance, enforced on every change (ADR-0003, ADR-0008):
# module boundaries, lint, tests, and the breaking-change contract gate (proof P5)
# must pass before merge.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance-checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA (tag in the comment), enforced by check-pinned-images (X8).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so the breaking-change gate can diff against the base branch
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --group dbt
      - name: Domain registry matches folders
        run: uv run python governance/policies/check_domains.py
      - name: Module boundaries (ADR-0008)
        run: uv run python governance/policies/check_boundaries.py
      - name: Contract governance (every landing dataset has a valid ODCS contract)
        run: uv run python governance/policies/check_contracts.py
      - name: Landing access is generated from config (ADR-0024, no hand-edited policies)
        run: uv run python platform/access/landing_access.py --check
      - name: Data product governance (definitions meet the standard)
        run: uv run python governance/policies/check_data_products.py
      - name: Publishing guardrail (output-port contract <-> model <-> definition)
        run: uv run python governance/policies/check_output_ports.py
      - name: Semantic governance (Ossie models build on contract columns, ADR-0010)
        run: uv run python governance/policies/check_semantics.py
      - name: AI-agent governance (domain-scoped, isolated, owned, no raw PII, ADR-0021)
        run: uv run python governance/policies/check_ai_agents.py
      - name: Pinned images (every compose image + Dockerfile base by digest, X8)
        run: uv run python governance/policies/check_pinned_images.py
      - name: ODCS is source of truth (dbt schema not drifted from contracts)
        run: |
          make sync-contracts
          git diff --exit-code -- domains \
            || { echo "dbt model YAML drifted from the ODCS contracts — run 'make sync-contracts' and commit."; exit 1; }
      - name: Breaking-change contract gate (proof P5)
        if: github.event_name == 'pull_request'
        run: BASE_REF=origin/${{ github.base_ref }} make check-breaking
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
