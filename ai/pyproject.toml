[project]
name = "dgp-ai"
version = "0.1.0"
description = "Governed AI consumers of the mesh: the semantic MCP server (one per domain, or platform-wide), the agent registry and the catalog-driven router — numbers only from the governed Ossie definitions, run as a consumer role."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "dgp-governance",
    "dgp-platform-semantics",
]

[tool.uv.sources]
dgp-governance = { workspace = true }
dgp-platform-semantics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgp_ai"]
