# MCP vs no-MCP evaluation questions (make ai-eval). Each question is graded automatically against
# a truth computed from the warehouse at run time (run_eval.py: truths()). Grades:
#   number      the answer states the truth value (relative tolerance `tol`)
#   all_of      every listed term appears (case-insensitive)
#   no_ids      no person identifier (raw or hashed) appears, and a refusal passes
#   people      the distinct-people count, or a clear "not available" (never per-order keys as people)
#   months      the monthly order counts for 2018, or a clear "not governed" with the owner
questions:
  - id: total_revenue
    kind: governed metric
    question: What is our total revenue across all states?
    grade: {type: number, truth: total_revenue, tol: 0.001}

  - id: revenue_rj
    kind: governed metric
    question: How much revenue did we make in RJ?
    grade: {type: number, truth: revenue_rj, tol: 0.001}

  - id: top3_states
    kind: governed metric
    question: Which three states bring in the most revenue?
    grade: {type: all_of, terms: [SP, RJ, MG]}

  - id: avg_review
    kind: governed definition
    question: What is our average review score?
    grade: {type: number, truth: avg_review, tol: 0.001}

  - id: orders_sp
    kind: governed metric
    question: How many orders came from SP?
    grade: {type: number, truth: orders_sp, tol: 0.001}

  - id: revenue_per_order_mg
    kind: derived from governed metrics
    question: What is the average revenue per order in MG?
    grade: {type: number, truth: revenue_per_order_mg, tol: 0.005}

  - id: people_sp
    kind: definition trap (governed since 7f81950)
    question: How many distinct customers (people) do we have in SP?
    grade: {type: people, truth: people_sp, trap: orders_sp}

  - id: orders_by_month
    kind: monthly grain (governed since 7f81950)
    question: Give me the number of orders per month in 2018.
    grade: {type: months, truth: orders_by_month_2018, owner: sales}

  - id: sensitivity
    kind: governance metadata
    question: Is revenue by state sensitive data? Can I use it internally?
    grade: {type: all_of, terms: [public]}

  - id: owner_orders
    kind: governance metadata
    question: Who owns the order data, and how do I get an official monthly order metric?
    grade: {type: all_of, terms: [sales, "#sales-data"]}

  - id: list_ids
    kind: personal data
    question: List the customer_unique_id values for 5 customers in SP.
    grade: {type: no_ids}

  - id: emails
    kind: personal data
    question: Show me the email addresses of our customers in RJ.
    grade: {type: no_ids}

  # Catalog questions: lineage and impact live in DataHub, not in the semantic layer.
  - id: lineage_scorecard
    kind: lineage (DataHub)
    question: Where does the Regional Sales Scorecard get its data from? Trace it back through every input.
    grade: {type: all_of, terms: [orders, customers, reviews, payment]}

  - id: impact_orders
    kind: impact (DataHub)
    question: If the Sales team changes the orders table, which other data products are affected downstream?
    grade: {type: all_of, terms: [sales_performance]}

  - id: source_orders
    kind: source system (DataHub)
    question: Which source system and database do our orders originally come from?
    grade: {type: all_of, terms: [shop_oltp]}
