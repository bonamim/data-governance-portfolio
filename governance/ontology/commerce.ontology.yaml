# The business ontology (ADR-0027): what the business is made of and how it relates (customers,
# orders, reviews, sellers, places), independent of any source system, table or analytics model.
# An Apache Ossie ontology document, validated with Ossie's own validator
# (platform/context/semantics/src/dgp_platform_semantics/vendor/ossie/). Ossie requires one self-contained document, so the whole
# business is modelled here, owned by the governance guild (one representative per domain).
#
# This is the business glossary in a structured form. A concept with a `description` here is a
# BUSINESS TERM: the description is its business definition (what the business means, the rule
# behind it, and what it is used for), and its responsible area is the domain that owns it. Entity
# types are always business terms, and a value type is one when the business has a rule about it
# (Amount paid vs Items value). Metrics with a formula (a count of valid orders, an LTV) are business
# terms too, defined executably in the owning domain's Ossie semantic model.
#
# Every value type also has a DATA ELEMENT definition (what a column holding it contains: format,
# type, sensitivity) in domains/<domain>/contracts/definitions/<value_type>.odcs.yaml (snake_case
# of its name), which contract columns link to and inherit. A value type without a description
# here (an id, a date, a state code) is a data element only, not a business term.
version: 0.2.0.dev0
name: commerce
description: >-
  The marketplace business: customers place orders and review them, and customers and sellers are
  located in Brazilian places.
prefixes:
  schema: https://schema.org/

ontology:
  # --- entity types ------------------------------------------------------------------------------
  - concept: Customer
    type: EntityType
    description: >-
      A person who buys on the marketplace. Identified by the customer person id. The same person
      gets a new customer key with every order, so people are counted by person id, never by key.
      Used for: counting buyers, repeat purchase and retention.
    iri: schema:Person
    identify_by: [has_person_id]
    relationships:
      - name: has_person_id
        roles: [{concept: CustomerPersonId}]
        multiplicity: OneToOne
        verbalizes: ["{Customer} is identified by {CustomerPersonId}"]
      - name: located_in
        roles: [{concept: Location}]
        multiplicity: ManyToOne
        verbalizes: ["{Customer} has a delivery address in {Location}"]

  - concept: Order
    type: EntityType
    description: >-
      One purchase on the marketplace, from placement to delivery. A valid order is one that was
      not canceled and not unavailable (the orders semantic model's valid_order_count). Used for:
      order volume, revenue and delivery performance.
    iri: schema:Order
    identify_by: [has_order_id]
    relationships:
      - name: has_order_id
        roles: [{concept: OrderId}]
        multiplicity: OneToOne
        verbalizes: ["{Order} is identified by {OrderId}"]
      - name: placed_by
        roles: [{concept: Customer}]
        multiplicity: ManyToOne
        verbalizes: ["{Order} is placed by {Customer}"]
      - name: has_customer_key
        description: >-
          A new customer key is issued with every order, so the key joins an order to its customer
          record one to one. It does not identify the person (count people with CustomerPersonId).
        roles: [{concept: CustomerKey}]
        multiplicity: OneToOne
        verbalizes: ["{Order} has customer key {CustomerKey}"]
      - name: paid
        roles: [{concept: PaymentAmount}]
        multiplicity: ManyToOne
        verbalizes: ["{Order} was paid {PaymentAmount}"]
      - name: has_items_value
        roles: [{concept: ItemsValue}]
        multiplicity: ManyToOne
        verbalizes: ["{Order} has items worth {ItemsValue}"]
      - name: has_status
        roles: [{concept: OrderStatus}]
        multiplicity: ManyToOne
        verbalizes: ["{Order} has status {OrderStatus}"]
      - name: purchased_at
        roles: [{concept: OrderPurchasedAt}]
        multiplicity: ManyToOne
        verbalizes: ["{Order} was purchased at {OrderPurchasedAt}"]
      - name: approved_at
        roles: [{concept: OrderApprovedAt}]
        multiplicity: ManyToOne
        verbalizes: ["{Order} was approved at {OrderApprovedAt}"]
      - name: delivered_at
        roles: [{concept: OrderDeliveredAt}]
        multiplicity: ManyToOne
        verbalizes: ["{Order} was delivered at {OrderDeliveredAt}"]
      - name: estimated_delivery_at
        roles: [{concept: OrderEstimatedDeliveryAt}]
        multiplicity: ManyToOne
        verbalizes: ["{Order} was estimated for delivery at {OrderEstimatedDeliveryAt}"]

  - concept: Review
    type: EntityType
    description: >-
      A customer's answer to the satisfaction survey sent after an order. Used for: customer
      satisfaction by region and seller.
    iri: schema:Review
    # Review ids repeat across orders in the source, so a review is identified by both.
    identify_by: [has_review_id, about]
    relationships:
      - name: has_review_id
        roles: [{concept: ReviewId}]
        multiplicity: ManyToOne
        verbalizes: ["{Review} has review id {ReviewId}"]
      - name: about
        roles: [{concept: Order}]
        multiplicity: ManyToOne
        verbalizes: ["{Review} is about {Order}"]
      - name: has_score
        roles: [{concept: ReviewScore}]
        multiplicity: ManyToOne
        verbalizes: ["{Review} has score {ReviewScore}"]
      - name: sent_on
        roles: [{concept: ReviewSentDate}]
        multiplicity: ManyToOne
        verbalizes: ["{Review} was sent on {ReviewSentDate}"]
      - name: answered_at
        roles: [{concept: ReviewAnsweredAt}]
        multiplicity: ManyToOne
        verbalizes: ["{Review} was answered at {ReviewAnsweredAt}"]
      - name: has_comment_title
        roles: [{concept: ReviewCommentTitle}]
        multiplicity: ManyToOne
        verbalizes: ["{Review} has comment title {ReviewCommentTitle}"]
      - name: has_comment_message
        roles: [{concept: ReviewCommentMessage}]
        multiplicity: ManyToOne
        verbalizes: ["{Review} has comment message {ReviewCommentMessage}"]

  - concept: Seller
    type: EntityType
    description: >-
      A business that sells its items on the marketplace and ships them to customers. Used for:
      seller performance and commercial reviews.
    iri: schema:Organization
    identify_by: [has_seller_id]
    relationships:
      - name: has_seller_id
        roles: [{concept: SellerId}]
        multiplicity: OneToOne
        verbalizes: ["{Seller} is identified by {SellerId}"]
      - name: located_in
        roles: [{concept: Location}]
        multiplicity: ManyToOne
        verbalizes: ["{Seller} is based in {Location}"]

  - concept: Location
    type: EntityType
    description: >-
      A Brazilian place, at the precision of a zip-code prefix: where customers receive and
      sellers ship from. Used for: regional analysis and delivery distances.
    iri: schema:PostalAddress
    identify_by: [has_zip_code_prefix]
    relationships:
      - name: has_zip_code_prefix
        roles: [{concept: ZipCodePrefix}]
        multiplicity: OneToOne
        verbalizes: ["{Location} is identified by {ZipCodePrefix}"]
      - name: in_city
        roles: [{concept: CityName}]
        multiplicity: ManyToOne
        verbalizes: ["{Location} is in city {CityName}"]
      - name: in_state
        roles: [{concept: StateCode}]
        multiplicity: ManyToOne
        verbalizes: ["{Location} is in state {StateCode}"]
      - name: at_latitude
        roles: [{concept: Latitude}]
        multiplicity: ManyToOne
        verbalizes: ["{Location} is at latitude {Latitude}"]
      - name: at_longitude
        roles: [{concept: Longitude}]
        multiplicity: ManyToOne
        verbalizes: ["{Location} is at longitude {Longitude}"]

  - concept: Product
    type: EntityType
    description: >-
      An item a seller lists on the marketplace, in a product category. Used for: what each order
      item sold.
    iri: schema:Product
    identify_by: [has_product_id]
    relationships:
      - name: has_product_id
        roles: [{concept: ProductId}]
        multiplicity: OneToOne
        verbalizes: ["{Product} is identified by {ProductId}"]
      - name: in_category
        roles: [{concept: ProductCategoryName}]
        multiplicity: ManyToOne
        verbalizes: ["{Product} is in category {ProductCategoryName}"]

  # --- value types -------------------------------------------------------------------------------
  - concept: CustomerPersonId
    type: ValueType
    extends: [String]

  - concept: CustomerKey
    type: ValueType
    extends: [String]
    description: >-
      The key of the customer record of one order. Rule: the marketplace issues a new customer key
      with every order, so the key identifies the customer record of one order, not the person. Used for: joining an
      order to its customer record. Never used to count customers. That is CustomerPersonId.

  - concept: OrderId
    type: ValueType
    extends: [String]
    iri: schema:orderNumber

  - concept: PaymentAmount
    type: ValueType
    extends: [Decimal]
    description: >-
      Revenue as received. Rule: everything customers paid for orders, all payments
      summed, including freight and instalment interest. Used for: revenue reporting by region
      (sales_performance.total_revenue). Not for seller performance or payouts: use ItemsValue.

  - concept: ItemsValue
    type: ValueType
    extends: [Decimal]
    description: >-
      Merchandise revenue. Rule: the items sold at their price, excluding freight and
      payment costs. Used for: seller performance (seller_performance.total_revenue). It is lower
      than PaymentAmount by the freight and the instalment interest customers pay.

  - concept: ReviewId
    type: ValueType
    extends: [String]

  - concept: ReviewScore
    type: ValueType
    extends: [Integer]
    iri: schema:reviewRating
    description: >-
      How satisfied the customer was with an order. Rule: the customer's answer to the post-order survey, from 1
      (worst) to 5 (best); an unanswered survey has no score. Used for: satisfaction by region
      (sales_performance.avg_review_score).

  - concept: ReviewSentDate
    type: ValueType
    extends: [Date]

  - concept: ReviewAnsweredAt
    type: ValueType
    extends: [Date]

  - concept: ReviewCommentTitle
    type: ValueType
    extends: [String]

  - concept: ReviewCommentMessage
    type: ValueType
    extends: [String]
    iri: schema:reviewBody

  - concept: SellerId
    type: ValueType
    extends: [String]

  - concept: ZipCodePrefix
    type: ValueType
    extends: [String]

  - concept: CityName
    type: ValueType
    extends: [String]
    iri: schema:addressLocality

  - concept: StateCode
    type: ValueType
    extends: [String]
    iri: schema:addressRegion

  - concept: OrderStatus
    type: ValueType
    extends: [String]
    description: >-
      Where an order is in its lifecycle, from created to delivered. Rule: an order whose status
      is canceled or unavailable is not a valid order. Used for: counting valid orders
      (valid_order_count) and following orders through fulfilment.

  - concept: OrderPurchasedAt
    type: ValueType
    extends: [Date]

  - concept: OrderApprovedAt
    type: ValueType
    extends: [Date]

  - concept: OrderDeliveredAt
    type: ValueType
    extends: [Date]

  - concept: OrderEstimatedDeliveryAt
    type: ValueType
    extends: [Date]

  - concept: ProductId
    type: ValueType
    extends: [String]

  - concept: ProductCategoryName
    type: ValueType
    extends: [String]

  - concept: Latitude
    type: ValueType
    extends: [Decimal]
    iri: schema:latitude

  - concept: Longitude
    type: ValueType
    extends: [Decimal]
    iri: schema:longitude
