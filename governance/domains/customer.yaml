# Domain registry entry (data-mesh.md). The single source of truth for this mesh domain —
# the domain list and metadata are read from here, never hardcoded (see governance/registry.py).
name: customer
display_name: "Customer"
description: "Customer master / directory and related attributes."
owner:
  team: customer
  contact: "#customer-data"

# Where this domain's operational alerts go (ADR-0016): quarantined or missing deliveries, SLA
# misses. The webhook URL is a secret, read from the named env var (secrets manager in production).
alerts:
  channel: "#customer-data"
  webhook_env: ALERT_WEBHOOK_CUSTOMER
