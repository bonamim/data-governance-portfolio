[project]
name = "dgp-governance"
version = "0.1.0"
description = "Reads the mesh's governed definitions (domain registry, governed tags, ontology, data products, output ports and approvals) so every check, generator and agent shares one answer."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "dgp-platform-contracts"]

[tool.uv.sources]
dgp-platform-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgp_governance"]
