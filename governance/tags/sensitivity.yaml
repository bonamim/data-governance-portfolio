# Governed tag `sensitivity` (ADR-0027): how sensitive a column's data is, the standard levels of the
# Snowflake-provided tag SNOWFLAKE.TAGS.SENSITIVITY. One file per governed tag, named for the tag,
# maintained by the governance guild (CODEOWNERS /governance/).
#
# A column's value is its ODCS `classification` (set on the column, or inherited from its data
# element). It is applied by whatever writes the table, before anyone can read it: the dbt post-hook
# `dgp_dbt.apply_governance_tags` on every output-port column, the loader on every raw-table column
# (dgp_platform_ingestion.governance), and on each table its most sensitive column's level. It is
# published to the catalog (DataHub tag), on the landing file too.
tag: sensitivity
warehouse_tag: SNOWFLAKE.TAGS.SENSITIVITY
odcs: {field: classification}
description: How sensitive the data is, i.e. who it may be shared with.
values:  # most sensitive first
  - value: restricted
    warehouse_value: RESTRICTED
    description: "Personal or regulated data, access-controlled and masked per policy (ADR-0013)."
  - value: confidential
    warehouse_value: CONFIDENTIAL
    description: "Business-sensitive, shared only with the teams that need it."
  - value: internal
    warehouse_value: INTERNAL
    description: "Internal-only, not shared outside the organisation."
  - value: public
    warehouse_value: PUBLIC
    description: "Shareable with any consumer."
