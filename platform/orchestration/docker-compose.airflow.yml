# Airflow 3 orchestration — milestone M1.
# Combined with the infra compose in the same project:
#   docker compose -f platform/infra/docker-compose.yml -f platform/orchestration/docker-compose.airflow.yml ...
# (the Makefile airflow-* targets do this). Shares the 'platform' network so DAG
# tasks reach minio / postgres-oltp / postgres-analytics by service name.
#
# One DAG bundle per domain (ADR-0005): each domain's pipelines/ folder is its own
# bundle, so domains deploy and fail independently (proof P1).

name: governance-platform

networks:
  platform:
    driver: bridge

volumes:
  airflow_meta:
  airflow_logs:
  dgp_data:

x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: platform/orchestration/Dockerfile
  image: governance-platform/airflow:3.3.2
  # Reach the DataHub GMS (dgp-catalog project) on the host gateway for lineage emission.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Each bundle points at a dedicated pipelines/ dir of DAG files, so scan them
    # all rather than only files containing the literal strings "airflow" and "dag"
    # (our one-line factory DAGs don't contain "airflow").
    AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/airflow
    # Dev auth: Simple auth manager, everyone is admin (no login). Production uses
    # OIDC SSO (docs/production-readiness.md X4).
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # In Airflow 3 the task supervisor calls back to the execution API; point it at
    # the api-server service, not localhost (which is whatever container runs the task).
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # One local DAG bundle per domain + the platform bundle (the acquire DAG).
    AIRFLOW__DAG_PROCESSOR__DISABLE_BUNDLE_VERSIONING: "true"
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
      [
        {"name":"platform","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/airflow/repo/platform/orchestration/dags"}},
        {"name":"sales","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/airflow/repo/domains/sales/pipelines"}},
        {"name":"customer","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/airflow/repo/domains/customer/pipelines"}},
        {"name":"marketplace","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/airflow/repo/domains/marketplace/pipelines"}},
        {"name":"customer_experience","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/airflow/repo/domains/customer_experience/pipelines"}},
        {"name":"reference","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/airflow/repo/reference/pipelines"}}
      ]
    # DataHub lineage (ADR-0018): the plugin emits DAG/task + dataset lineage to GMS, which
    # lives in the dgp-catalog compose project — reach it on the host gateway.
    AIRFLOW_CONN_DATAHUB_REST_DEFAULT: "datahub-rest://host.docker.internal:${DATAHUB_MAPPED_GMS_PORT}"
    # The landing-quality publisher (publish_quality task) talks to the same GMS.
    DATAHUB_GMS: "http://host.docker.internal:${DATAHUB_MAPPED_GMS_PORT}"
    AIRFLOW__DATAHUB__ENABLED: "true"
    AIRFLOW__DATAHUB__CONN_ID: datahub_rest_default
    AIRFLOW__DATAHUB__CAPTURE_EXECUTION: "true"
    AIRFLOW__DATAHUB__CAPTURE_OWNERSHIP_INFO: "true"
    AIRFLOW__DATAHUB__CAPTURE_TAGS_INFO: "true"
    # Don't surface the abstract published/<domain> scheduling Assets as catalog datasets;
    # lineage flows through the real output-port tables we declare as the task's iolets.
    AIRFLOW__DATAHUB__CAPTURE_AIRFLOW_ASSETS: "false"
    # Ingestion runtime: the repo is mounted here; the Olist cache is a shared volume.
    DGP_REPO_ROOT: /opt/airflow/repo
    DGP_DATA_DIR: /opt/airflow/data
    # Reach the platform services by compose DNS (overrides the host localhost defaults).
    OLTP_HOST: postgres-oltp
    OLTP_INTERNAL_PORT: "5432"
    ANALYTICS_HOST: postgres-analytics
    ANALYTICS_INTERNAL_PORT: "5432"
    MINIO_ENDPOINT: http://minio:9000
    # Credentials + names the ingestion code needs (from .env).
    OLTP_DB: ${OLTP_DB}
    ANALYTICS_DB: ${ANALYTICS_DB}
    OLTP_LOADER_PASSWORD: ${OLTP_LOADER_PASSWORD}
    OLTP_READER_PASSWORD: ${OLTP_READER_PASSWORD}
    PLATFORM_LOADER_PASSWORD: ${PLATFORM_LOADER_PASSWORD}
    # Ingestion talks to the landing zone as the least-privilege loader, never as MinIO root
    # (ADR-0024). The partner secret is only for the PoC `land` simulator.
    LANDING_INBOX_BUCKET: ${LANDING_INBOX_BUCKET:-landing-inbox}
    LANDING_ARCHIVE_BUCKET: ${LANDING_ARCHIVE_BUCKET:-landing-archive}
    LANDING_LOCK_MODE: ${LANDING_LOCK_MODE:-GOVERNANCE}
    LANDING_LOADER_USER: ${LANDING_LOADER_USER}
    LANDING_LOADER_SECRET_KEY: ${LANDING_LOADER_SECRET_KEY}
    LANDING_PARTNER_OLIST_SECRET: ${LANDING_PARTNER_OLIST_SECRET:-}
    STATE_BUCKET: ${STATE_BUCKET}
    OLIST_DATASET: ${OLIST_DATASET}
    KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
    KAGGLE_KEY: ${KAGGLE_KEY:-}
    # Transform (dbt + write-audit-publish + grants): per-domain roles, the access_admin role
    # (masking + grants) and the dbt profiles.
    DBT_PROFILES_DIR: /opt/airflow/repo/platform/transform
    # Every Postgres client in the tasks verifies the server certificate (X3): libpq reads these.
    PGSSLMODE: verify-full
    PGSSLROOTCERT: /opt/airflow/repo/platform/infra/tls/out/ca.crt
    # Masking + grants after a publish run as access_admin, never the superuser (X5).
    ACCESS_ADMIN_PASSWORD: ${ACCESS_ADMIN_PASSWORD}
    ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD}
    COMPLIANCE_PASSWORD: ${COMPLIANCE_PASSWORD}
    SALES_ROLE_PASSWORD: ${SALES_ROLE_PASSWORD}
    CUSTOMER_ROLE_PASSWORD: ${CUSTOMER_ROLE_PASSWORD}
    MARKETPLACE_ROLE_PASSWORD: ${MARKETPLACE_ROLE_PASSWORD}
    CUSTOMER_EXPERIENCE_ROLE_PASSWORD: ${CUSTOMER_EXPERIENCE_ROLE_PASSWORD}
    REFERENCE_ROLE_PASSWORD: ${REFERENCE_ROLE_PASSWORD}
  volumes:
    # Read-write so the transform DAGs' dbt runs can write target/ (gitignored).
    - ../..:/opt/airflow/repo
    # DAG files are discovered read-only from the mounted repo (bundles).
    - airflow_logs:/opt/airflow/logs
    - dgp_data:/opt/airflow/data        # shared Olist cache across tasks
  networks: [platform]
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # Airflow's own metadata database (run state + data intervals, ADR-0006).
  postgres-airflow:
    image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    entrypoint: ["bash", "/usr/local/bin/dgp-pg-entrypoint.sh"]  # TLS-only + audit logging (X3, X9)
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - ../infra/postgres/hardened-entrypoint.sh:/usr/local/bin/dgp-pg-entrypoint.sh:ro
      - ../infra/postgres/pg_hba.conf:/pgconf/pg_hba.conf:ro
      - ../infra/tls/out:/pgtls-src:ro
      - airflow_meta:/var/lib/postgresql/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Runs DB migrations once, then exits.
  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "${AIRFLOW_API_PORT}:8080"
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: ["triggerer"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
