[project]
name = "dgp-platform-catalog"
version = "0.1.0"
description = "Publishes the mesh's governance into DataHub from the definitions in git — domains, data products, the business glossary, governed tags, landing datasets and every contract-gate result."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "dgp-governance",
    "dgp-platform-semantics",
    "dgp-platform-ingestion",
    "dgp-platform-quality",
]

[project.optional-dependencies]
# The DataHub SDK the publishers emit with. Optional, so reading GMS (gms.py) needs none of it; the
# Airflow image already has it, through the DataHub Airflow plugin.
publish = ["acryl-datahub>=1.7"]

[tool.uv.sources]
dgp-governance = { workspace = true }
dgp-platform-semantics = { workspace = true }
dgp-platform-ingestion = { workspace = true }
dgp-platform-quality = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgp_platform_catalog"]
