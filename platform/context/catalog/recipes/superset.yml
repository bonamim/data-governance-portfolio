# DataHub ingestion: Superset (BI): dashboards, charts and datasets, with lineage from a chart to
# the warehouse table it reads. This finishes the lineage's last hop, output port -> BI chart
# (proof P7). Ingestion runs on the host, and secrets come from the environment (sourced from .env).
source:
  type: superset
  config:
    connect_uri: "http://localhost:${SUPERSET_PORT}"
    username: "${SUPERSET_ADMIN}"
    password: "${SUPERSET_ADMIN_PASSWORD}"
    provider: db
    # Map the Superset connection name to the warehouse database so a chart's dataset lineage
    # resolves to the real postgres output-port table (completing port -> chart).
    database_alias:
      "analytics (warehouse)": "${ANALYTICS_DB}"
sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS}"
