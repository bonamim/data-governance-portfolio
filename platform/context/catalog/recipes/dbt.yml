# DataHub ingestion — dbt models, columns, tests and lineage for ONE domain project.
# Run once per domain with DBT_TARGET pointed at that project's target/ (see `make catalog-ingest`).
# target_platform=postgres so each dbt model links to the warehouse dataset ingested by
# postgres_analytics.yml — that join is what produces end-to-end lineage (proof P7).
source:
  type: dbt
  config:
    manifest_path: "${DBT_TARGET}/manifest.json"
    catalog_path: "${DBT_TARGET}/catalog.json"
    run_results_paths:
      - "${DBT_TARGET}/run_results.json"
    target_platform: postgres
    # Keep URNs exactly as the warehouse names them, so the dbt node and the Postgres dataset
    # ingested by postgres_analytics.yml share one URN (set explicitly: DataHub warns otherwise).
    convert_urns_to_lowercase: false
    # Emit only this project's nodes. dbt-loom puts other domains' public models in the manifest
    # as stubs (no descriptions); emitting them would overwrite the owning domain's node.
    # They still resolve lineage, so the cross-domain edges remain.
    node_name_pattern:
      allow:
        - "^[a-z_]+\\.${DBT_PROJECT}\\."
    # dbt tests become DataHub assertions on the modelled datasets.
    entities_enabled:
      test_results: "YES"
sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS}"
