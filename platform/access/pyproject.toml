[project]
name = "dgp-platform-access"
version = "0.1.0"
description = "Access control from the governed definitions: consumer grants on output ports, role-aware PII masking views, and the landing zone's object-store policies."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2", "dgp-governance", "dgp-platform-ingestion"]

[tool.uv.sources]
dgp-governance = { workspace = true }
dgp-platform-ingestion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgp_platform_access"]
