[project]
name = "dgp-platform-ingestion"
version = "0.1.0"
description = "Self-serve ingestion for the data mesh platform: Kaggle acquisition, landing-zone upload, operational seed, and raw load with an ingestion ledger. Domains provide only declarative source config."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "kaggle>=1.6",
    "dgp-platform-quality",
    "dgp-platform-contracts",
    "dgp-governance",
]

[project.scripts]
dgp-ingest = "dgp_platform_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgp_platform_ingestion"]

[tool.uv.sources]
dgp-platform-quality = { workspace = true }
dgp-platform-contracts = { workspace = true }
dgp-governance = { workspace = true }
