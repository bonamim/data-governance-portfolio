[project]
name = "dgp-platform-contracts"
version = "0.1.0"
description = "The platform's one reader of ODCS contracts: loads a contract with its linked definitions inlined, so masking, grants, the catalog, dbt, the semantic layer, the policy checks and the quality engine all see the same resolved contract (ADR-0027)."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgp_platform_contracts"]
