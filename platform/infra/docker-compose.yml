# Local self-serve platform — milestone M1.
# MinIO (landing zone + platform state) and two Postgres instances
# (operational source + analytics warehouse). Airflow is added in the same
# milestone via docker-compose.airflow.yml.
#
# Images are pinned by digest (production-readiness X8). Local defaults here are
# NOT production-safe; docs/production-readiness.md lists what changes for prod.
#
# NOTE ON THE MINIO IMAGE: MinIO's community images moved behind authentication
# in 2025 (quay.io) and Bitnami froze its free Docker Hub tags (Aug 2025), so we
# pin Bitnami's last free MinIO build — it is the genuine MinIO server. See
# docs/adr/0007-minio-image-source.md for the supply-chain note and the switch
# to the official image in production.

name: governance-platform

networks:
  platform:
    driver: bridge

volumes:
  minio_data:
  oltp_data:
  analytics_data:
  # WAL archive for shop_oltp point-in-time recovery (DR §3, RPO 5 min). Locally a separate volume
  # standing in for the replicated, object-locked archive store pgBackRest/WAL-G push to.
  oltp_wal_archive:
  pgadmin_data:

services:
  # ---------------------------------------------------------------- MinIO ---
  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_SCHEME: http
      # Encryption at rest (X7): every bucket defaults to SSE-S3 under this KMS key (minio-init).
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT}:9000"       # S3 API (the community console was removed; see s3-browser)
    volumes:
      - minio_data:/bitnami/minio/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Creates the buckets and turns on versioning (production-readiness: versioning
  # on every bucket recovers overwritten/deleted files). Runs once and exits.
  minio-init:
    image: bitnamilegacy/minio-client@sha256:00dcc4e58ada0df45bb7d9ee435af98295f96c27c3c68292ce78ec700a87b511
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LANDING_BUCKET: ${LANDING_BUCKET}
      STATE_BUCKET: ${STATE_BUCKET}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-platform-backups}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # The healthcheck can pass a moment before the S3 API accepts connections,
        # so retry the alias until MinIO is actually reachable.
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
            break
          fi
          echo "waiting for MinIO S3 API ($$attempt/30)..."; sleep 2
        done
        mc ready local
        for bucket in "$$LANDING_BUCKET" "$$STATE_BUCKET"; do
          mc mb --ignore-existing "local/$$bucket"
          mc version enable "local/$$bucket"
          # Retention (ADR-0011): keep current versions; expire superseded/deleted
          # versions after the retention window so storage does not grow forever.
          # Production also sets object-lock on landing (production-readiness.md).
          mc encrypt set sse-s3 "local/$$bucket" >/dev/null   # encryption at rest (X7)
          mc ilm rule add --noncurrent-expire-days 365 "local/$$bucket" >/dev/null 2>&1 \
            || mc ilm rule add --expire-days 365 --noncurrent-expire-days 365 "local/$$bucket" >/dev/null 2>&1 || true
          echo "bucket ready (versioned, SSE-S3, 365d retention): $$bucket"
        done
        # Backups (DR §3, proof P9): versioned, ~4 weekly cycles kept. Production puts this in a
        # DIFFERENT location from the landing zone, object-locked and replicated.
        mc mb --ignore-existing "local/$$BACKUP_BUCKET"
        mc version enable "local/$$BACKUP_BUCKET"
        mc encrypt set sse-s3 "local/$$BACKUP_BUCKET" >/dev/null
        mc ilm rule add --expire-days 35 --noncurrent-expire-days 35 "local/$$BACKUP_BUCKET" >/dev/null 2>&1 || true
        echo "bucket ready (versioned, SSE-S3, 35d retention): $$BACKUP_BUCKET"
    networks: [platform]
    restart: "no"

  # Web UI for the object store. MinIO removed its built-in console from the community
  # server in 2025 (ADR-0007), so this is a lightweight S3 browser pointed at the MinIO
  # S3 API — reachable on the port the old console used.
  s3-browser:
    image: cloudlena/s3manager@sha256:777f443adc9225f111557c89548b52aaf5cff8a474773b7a730e6153b07a13a8
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      ENDPOINT: minio:9000
      USE_SSL: "false"
      REGION: us-east-1
    ports:
      - "${MINIO_CONSOLE_PORT}:8080"   # browse at http://localhost:9001
    networks: [platform]

  # ----------------------------------------------- Postgres: shop_oltp -------
  postgres-oltp:
    image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    entrypoint: ["bash", "/usr/local/bin/dgp-pg-entrypoint.sh"]  # TLS-only + audit logging (X3, X9)
    command:
      - "postgres"
      - "-c"
      - "password_encryption=scram-sha-256"   # production-readiness: scram, not md5
      # Continuous WAL archiving -> point-in-time recovery (tier 1, RPO 5 min; proof P9). A segment
      # is shipped at least every archive_timeout while there is activity, bounding data loss.
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f"
      - "-c"
      - "archive_timeout=60"
    environment:
      POSTGRES_USER: ${OLTP_SUPERUSER}
      POSTGRES_PASSWORD: ${OLTP_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${OLTP_DB}
      # consumed by 00-init.sh to create least-privilege roles
      OLTP_LOADER_PASSWORD: ${OLTP_LOADER_PASSWORD}
      OLTP_READER_PASSWORD: ${OLTP_READER_PASSWORD}
      CATALOG_READER_PASSWORD: ${CATALOG_READER_PASSWORD}
    ports:
      - "${OLTP_PORT}:5432"
    volumes:
      - ./postgres/hardened-entrypoint.sh:/usr/local/bin/dgp-pg-entrypoint.sh:ro
      - ./postgres/pg_hba.conf:/pgconf/pg_hba.conf:ro
      - ./tls/out:/pgtls-src:ro
      - oltp_data:/var/lib/postgresql/data
      - oltp_wal_archive:/wal-archive
      - ./postgres/oltp:/docker-entrypoint-initdb.d:ro
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_SUPERUSER} -d ${OLTP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------- Postgres: analytics -------
  postgres-analytics:
    image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    entrypoint: ["bash", "/usr/local/bin/dgp-pg-entrypoint.sh"]  # TLS-only + audit logging (X3, X9)
    command:
      - "postgres"
      - "-c"
      - "password_encryption=scram-sha-256"
    environment:
      POSTGRES_USER: ${ANALYTICS_SUPERUSER}
      POSTGRES_PASSWORD: ${ANALYTICS_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${ANALYTICS_DB}
      # consumed by 00-init.sh to create platform_loader + per-domain roles
      PLATFORM_LOADER_PASSWORD: ${PLATFORM_LOADER_PASSWORD}
      SALES_ROLE_PASSWORD: ${SALES_ROLE_PASSWORD}
      CUSTOMER_ROLE_PASSWORD: ${CUSTOMER_ROLE_PASSWORD}
      MARKETPLACE_ROLE_PASSWORD: ${MARKETPLACE_ROLE_PASSWORD}
      CUSTOMER_EXPERIENCE_ROLE_PASSWORD: ${CUSTOMER_EXPERIENCE_ROLE_PASSWORD}
      REFERENCE_ROLE_PASSWORD: ${REFERENCE_ROLE_PASSWORD}
      ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD}
      COMPLIANCE_PASSWORD: ${COMPLIANCE_PASSWORD}
      ACCESS_ADMIN_PASSWORD: ${ACCESS_ADMIN_PASSWORD}
      CATALOG_READER_PASSWORD: ${CATALOG_READER_PASSWORD}
      AGENT_SALES_PASSWORD: ${AGENT_SALES_PASSWORD}
      AGENT_CUSTOMER_PASSWORD: ${AGENT_CUSTOMER_PASSWORD}
      AGENT_MARKETPLACE_PASSWORD: ${AGENT_MARKETPLACE_PASSWORD}
      AGENT_CUSTOMER_EXPERIENCE_PASSWORD: ${AGENT_CUSTOMER_EXPERIENCE_PASSWORD}
      AGENT_REFERENCE_PASSWORD: ${AGENT_REFERENCE_PASSWORD}
    ports:
      - "${ANALYTICS_PORT}:5432"
    volumes:
      - ./postgres/hardened-entrypoint.sh:/usr/local/bin/dgp-pg-entrypoint.sh:ro
      - ./postgres/pg_hba.conf:/pgconf/pg_hba.conf:ro
      - ./tls/out:/pgtls-src:ro
      - analytics_data:/var/lib/postgresql/data
      - ./postgres/analytics:/docker-entrypoint-initdb.d:ro
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_SUPERUSER} -d ${ANALYTICS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ------------------------------------------------------------- pgAdmin ---
  # Database UI for every Postgres in the platform (`make pgadmin`): shop_oltp, analytics (as the
  # superuser AND as the least-privilege analytics_reader, to see exactly what consumers see) and the
  # Airflow metadata DB. Desktop mode = no login, like the other local UIs. Servers come from
  # pgadmin/servers.template.json; the pgpass is generated from .env on every start, so no password is
  # committed and a rotated .env is picked up on restart. Local dev only: not deployed to production
  # (preflight X2 flags its password).
  pgadmin:
    image: dpage/pgadmin4@sha256:d115bcd737940a6cfb61a54439d50de8b850e0782e2363102c9fa761f4022f49 # 9.8
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        esc() { printf '%s' "$$1" | sed 's/\\/\\\\/g; s/:/\\:/g'; }
        {
          echo "postgres-oltp:5432:*:$$OLTP_SUPERUSER:$$(esc "$$OLTP_SUPERUSER_PASSWORD")"
          echo "postgres-analytics:5432:*:$$ANALYTICS_SUPERUSER:$$(esc "$$ANALYTICS_SUPERUSER_PASSWORD")"
          echo "postgres-analytics:5432:*:analytics_reader:$$(esc "$$ANALYTICS_READER_PASSWORD")"
          echo "postgres-airflow:5432:*:airflow:$$(esc "$$AIRFLOW_DB_PASSWORD")"
        } > /var/lib/pgadmin/.pgpass
        chmod 600 /var/lib/pgadmin/.pgpass
        sed -e "s/__OLTP_DB__/$$OLTP_DB/; s/__OLTP_SUPERUSER__/$$OLTP_SUPERUSER/" \
            -e "s/__ANALYTICS_DB__/$$ANALYTICS_DB/g; s/__ANALYTICS_SUPERUSER__/$$ANALYTICS_SUPERUSER/" \
            /pgadmin-config/servers.template.json > /tmp/servers.json
        exec /entrypoint.sh
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      OLTP_DB: ${OLTP_DB}
      OLTP_SUPERUSER: ${OLTP_SUPERUSER}
      OLTP_SUPERUSER_PASSWORD: ${OLTP_SUPERUSER_PASSWORD}
      ANALYTICS_DB: ${ANALYTICS_DB}
      ANALYTICS_SUPERUSER: ${ANALYTICS_SUPERUSER}
      ANALYTICS_SUPERUSER_PASSWORD: ${ANALYTICS_SUPERUSER_PASSWORD}
      ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin:/pgadmin-config:ro
      - ./tls/out/ca.crt:/pgtls/ca.crt:ro   # verify-full against the local CA (X3)
    networks: [platform]
    depends_on:
      postgres-oltp:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
