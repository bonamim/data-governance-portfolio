# Client authentication for every platform Postgres (X3). Used via hba_file= by hardened-entrypoint.sh.
# TYPE      DATABASE  USER  ADDRESS     METHOD
# In-container unix socket only: init scripts, healthchecks, `docker exec psql` (operator break-glass).
local       all       all               trust
local       replication all             trust   # in-container base backups (pg_basebackup)
# Every network client: TLS + scram-sha-256. Production narrows ADDRESS to the platform subnets.
hostssl     all       all   0.0.0.0/0   scram-sha-256
hostssl     all       all   ::/0        scram-sha-256
# Plain TCP is refused outright.
hostnossl   all       all   0.0.0.0/0   reject
hostnossl   all       all   ::/0        reject
